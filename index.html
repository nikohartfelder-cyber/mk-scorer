<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MK SCORER</title>
<style>
  @font-face{
    font-family:'MK4';
    src:url('fonts/mk4.ttf') format('truetype');
    font-display:swap;
  }
  :root{
    --bg:#0e1116; --card:rgba(26,31,39,.82); --card2:rgba(35,42,52,.85); --fg:#c1121f; --muted:#8a1420;
    --accent:#3ddc84; --accent2:#ffb454; --danger:#ff5c6c; --border:#2b3340;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    font-family:'MK4',system-ui,-apple-system,sans-serif;}
  button,input,select,textarea{font-family:'MK4',system-ui,-apple-system,sans-serif !important;}
  html{background:#000;}
  html{height:100%;}
  body{background:#000;
       color:var(--fg);font-family:'MK4',system-ui,-apple-system,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;position:relative;}
  /* MK-Logo als grosses, zentriertes Hintergrund-Element */
  .bg-logo{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
           pointer-events:none;}
  .bg-logo img{width:96vmin;opacity:.6;}   /* gross, Ring bleibt komplett sichtbar */
  .bg-shade{position:fixed;inset:0;z-index:0;background:radial-gradient(
      ellipse at center, rgba(0,0,0,.25) 0%, rgba(0,0,0,.75) 100%);
      pointer-events:none;}
  header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
         border-bottom:1px solid var(--border);position:relative;z-index:1;}
  header h1{font-size:18px;}
  header h1 span{color:#c1121f;}
  .iconbtn{background:var(--card2);border:1px solid var(--border);color:var(--fg);
           border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;}
  main{flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;
       position:relative;z-index:1;}

  /* Spieler-Kacheln */
  .board{display:flex;flex-wrap:wrap;gap:10px;padding:14px 12px 6px;}
  .player{background:var(--card);border-radius:14px;padding:10px 12px;text-align:center;
          border:2px solid transparent;transition:border-color .2s;
          flex:1 1 calc(50% - 10px);min-width:130px;}
  .player.active{border-color:var(--accent);}
  .pname{font-size:19px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pscore{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;}
  .plegs{font-size:12px;color:var(--accent);margin-top:2px;}
  .avg{font-size:11px;color:var(--muted);}

  .turninfo{text-align:center;padding:6px 12px 2px;min-height:46px;}
  .lastvisit{font-size:13px;color:var(--muted);}
  .checkout{font-size:15px;color:var(--accent2);font-weight:600;min-height:22px;}
  .curvisit{min-height:22px;text-align:center;font-size:15px;padding-bottom:4px;}

  /* Tabs: Einzel / Summe */
  .tabs{display:flex;gap:8px;padding:4px 12px;}
  .tab{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--muted);
       border-radius:10px;padding:9px 0;font-size:14px;font-weight:600;cursor:pointer;}
  .tab.on{color:var(--accent);border-color:var(--accent);}

  /* Summen-Eingabe */
  .quickrow{display:none;padding:10px 12px 0;gap:8px;}
  .quickrow.on{display:flex;}
  .quickrow input{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--fg);
      border-radius:12px;padding:16px;font-size:32px;text-align:center;
      font-variant-numeric:tabular-nums;}
  .quickrow button{background:#1d3a28;border:1px solid #2f5c40;color:var(--accent);
      border-radius:10px;padding:0 22px;font-size:17px;font-weight:700;cursor:pointer;}
  .micbtn{background:#3a1d22 !important;border-color:#5c3038 !important;color:#ff6b6b !important;
      font-size:26px !important;padding:0 18px !important;min-width:64px;}
  .micbtn.listening{background:#5c1a1a !important;outline:3px solid #ff5c6c;
      animation:pulse 1s infinite alternate;}
  @keyframes pulse{from{box-shadow:0 0 0 0 rgba(255,92,108,.4)}to{box-shadow:0 0 14px 3px rgba(255,92,108,.55)}}

  /* Einzel-Tasten */
  .padwrap{display:none;}
  .padwrap.on{display:block;}
  .pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:10px 12px 0;}
  .key{background:var(--card2);border:1px solid var(--border);color:var(--fg);
       border-radius:12px;padding:20px 0;font-size:22px;font-weight:700;cursor:pointer;}
  .key:active{transform:scale(.94);}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 2fr;gap:7px;padding:7px 12px 10px;}
  .key.dbl.on{outline:2px solid var(--accent);}
  .key.trpl.on{outline:2px solid var(--accent2);}
  .key.enter{background:#1d3a28;border-color:#2f5c40;color:var(--accent);}
  .key.undo{background:#382226;border-color:#5c3038;color:var(--danger);}

  /* Große Zifferntasten unten */
  .numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px 12px 4px;}
  .numpad{gap:9px;padding:10px 12px 6px;}
  .numpad button{background:#1c232d;border:1px solid var(--border);color:var(--fg);
      border-radius:14px;padding:26px 0;font-size:36px;font-weight:700;cursor:pointer;
      font-variant-numeric:tabular-nums;}
  .numpad button:active{transform:scale(.94);background:#242e3a;}
  .numpad button.fn{font-size:28px;background:#382226;border-color:#5c3038;color:var(--danger);}
  .numpad button.okb{font-size:30px;background:#1d3a28;border-color:#2f5c40;color:var(--accent);}

  footer{position:relative;z-index:1;text-align:center;padding:10px 8px 14px;
         font-size:11px;color:#ffffff;opacity:.85;letter-spacing:.4px;line-height:1.5;}
  footer b{color:#ffffff;font-size:12px;}

  .msg{min-height:26px;text-align:center;font-size:14px;padding:0 16px 10px;}
  .msg.err{color:var(--danger);}
  .msg.ok{color:var(--accent);}

  dialog{background:#1a1f27;color:var(--fg);border:1px solid var(--border);
         border-radius:16px;padding:20px;max-width:360px;width:92%;}
  dialog::backdrop{background:rgba(0,0,0,.65);}
  dialog h2{font-size:18px;margin-bottom:10px;}
  dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;}
  dialog input,dialog select{width:100%;background:var(--bg);border:1px solid var(--border);
      color:var(--fg);border-radius:8px;padding:10px;font-size:15px;}
  .nameRow{display:flex;gap:8px;margin-bottom:6px;}
  .dlg-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
</style>
</head>
<body>
<div class="bg-logo"><img src="Mk.webp" alt=""></div>
<div class="bg-shade"></div>
<header>
  <h1 style="display:flex;align-items:center;gap:8px;"><svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#c1121f" stroke-width="6"/><path d="M50 18 C30 22 22 40 28 56 C33 68 45 74 50 82 C55 74 67 68 72 56 C78 40 70 22 50 18 Z" fill="#c1121f"/><path d="M50 26 C38 29 32 42 36 53 C39 62 46 66 50 72 C54 66 61 62 64 53 C68 42 62 29 50 26 Z" fill="#0d0d0d"/><circle cx="44" cy="44" r="5" fill="#e02b2b"/><path d="M58 52 l8 4 -8 3 z" fill="#c1121f"/></svg> <span>MK</span> SCORER</h1>
  <div style="display:flex;gap:8px;">
    <button class="iconbtn" id="undoBtn"><<  Undo</button>
    <button class="iconbtn" id="setBtn">Neu</button>
  </div>
</header>

<main>
  <div class="board" id="board"></div>

  <div class="turninfo">
    <div class="lastvisit" id="lastVisit"></div>
    <div class="checkout" id="checkout"></div>
  </div>
  <div class="curvisit" id="curVisit"></div>

  <div class="tabs">
    <button class="tab on" id="tabQuick">Summe eingeben</button>
    <button class="tab" id="tabDarts">Einzelne Pfeile</button>
  </div>

  <div class="quickrow on" id="quickRow">
    <input id="quickInput" type="number" inputmode="numeric" min="0" max="180" placeholder="z.B. 140">
    <button class="micbtn" id="micBtn" title="Zahl diktieren">&#127908;</button>
    <button id="quickBtn">OK</button>
  </div>

  <div class="numpad" id="numpad"></div>

  <div class="padwrap" id="padWrap">
    <div class="pad" id="pad"></div>
    <div class="row">
      <button class="key dbl" id="mulD">D ×2</button>
      <button class="key trpl" id="mulT">T ×3</button>
      <button class="key" id="bullBtn">Bull</button>
      <button class="key" id="missBtn">Miss</button>
      <button class="key enter" id="endBtn">Weiter ></button>
    </div>
  </div>
  <div class="msg" id="msg"></div>

  <footer>
    <b>MK SCORER 1.0</b> beta version<br>
    developed by N. Hartfelder. For testing purposes only!
  </footer>
</main>

<dialog id="setupDlg">
  <h2>Spiel-Einstellungen</h2>
  <label>Spieler (eine Zeile pro Name)</label>
  <div id="nameRows"></div>
  <button class="iconbtn" id="addPlayerBtn">+ Spieler</button>
  <label>Startpunkte</label>
  <select id="startSel"><option>301</option><option selected>501</option><option>701</option></select>
  <label>Finish-Modus</label>
  <select id="outSel"><option value="double" selected>Double Out</option><option value="straight">Straight Out</option></select>
  <label>Legs zum Gewinnen</label>
  <select id="legsSel"><option>1</option><option selected>3</option><option>5</option><option>7</option><option>11</option><option>21</option></select>
  <div class="dlg-actions">
    <button class="iconbtn" id="cancelBtn">Abbrechen</button>
    <button class="iconbtn" style="background:#1d3a28;color:var(--accent)" id="startBtn2">Start!</button>
  </div>
</dialog>

<div id="winOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
     align-items:center;justify-content:center;z-index:10;">
  <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;
       padding:26px;text-align:center;max-width:320px;width:88%;">
    <div style="font-size:44px;"></div>
    <h2 id="winnerText" style="margin:8px 0 18px;"></h2>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="iconbtn" id="nextLegBtn">Nächstes Leg ></button>
      <button class="iconbtn" id="newMatchBtn">Neues Match</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
let G = null;

/* ================= Checkout-Hinweise (Double Out) ================= */
const CHECKOUT = {
 170:"T20 T20 Bull",167:"T20 T19 Bull",164:"T20 T18 Bull",161:"T20 T17 Bull",
 160:"T20 T20 D20",158:"T20 T20 D19",157:"T20 T19 D20",156:"T20 T20 D18",155:"T20 T19 D19",
 154:"T20 T18 D20",153:"T20 T19 D18",152:"T20 T20 D16",151:"T20 T17 D20",150:"T20 T18 D18",
 149:"T20 T19 D16",148:"T20 T16 D20",147:"T20 T17 D18",146:"T20 T18 D16",145:"T20 T19 D14",
 144:"T20 T20 D12",143:"T20 T17 D16",142:"T20 T14 D20",141:"T20 T19 D12",140:"T20 T20 D10",
 139:"T20 T13 D20",138:"T20 T18 D12",137:"T20 T19 D10",136:"T20 T20 D8",135:"Bull T20 D20",
 134:"T20 T14 D16",133:"T20 T19 D8",132:"T20 T16 D12",131:"T20 T13 D16",130:"T20 T18 D8",
 129:"T19 T16 D12",128:"T18 T14 D16",127:"T20 T17 D8",126:"T19 T19 D6",125:"T20 T19 D4",
 124:"T20 T16 D8",123:"T19 T16 D9",122:"T18 T18 D7",121:"T20 S11 D14",120:"T20 S20 D20",
 119:"T19 S10 D16",118:"T20 S18 D20",117:"T20 S17 D20",116:"T20 S16 D20",115:"T20 S15 D20",
 114:"T20 S14 D20",113:"T20 S13 D20",112:"T20 S12 D20",111:"T20 S19 D16",110:"T20 S10 D20",
 109:"T20 S9 D20",108:"T20 S8 D20",107:"T19 S10 D20",106:"T20 S6 D20",105:"T20 S13 D16",
 104:"T18 S18 D16",103:"T20 S3 D20",102:"T20 S10 D16",101:"T17 S10 D20",100:"T20 D20",
 99:"T19 S10 D16",98:"T20 D19",97:"T19 D20",96:"T20 D18",95:"T19 D19",94:"T18 D20",
 93:"T19 D18",92:"T20 D16",91:"T17 D20",90:"T18 D18",89:"T19 D16",88:"S16 D20",
 87:"T17 D18",86:"T18 D16",85:"T15 D20",84:"T20 D12",83:"T17 D16",82:"Bull D16",
 81:"T19 D12",80:"T20 D10",79:"S19 D20",78:"T18 D12",77:"T19 D10",76:"T20 D8",
 75:"T17 D12",74:"T14 D16",73:"T19 D8",72:"S16 D12",71:"T13 D16",70:"T18 D8",
 69:"S11 D18",68:"T20 D4",67:"T17 D8",66:"T10 D18",65:"25 D20",64:"S16 D8",
 63:"T13 D12",62:"T10 D16",61:"T15 D8",60:"S20 D20",59:"S19 D20",58:"S18 D20",
 57:"S17 D20",56:"T16 D4",55:"S15 D20",54:"S18 D18",53:"S13 D20",52:"T12 D8",
 51:"S11 D20",50:"S10 D20",49:"S9 D20",48:"S16 D16",47:"S15 D16",46:"S14 D16",
 45:"S13 D16",44:"S12 D16",43:"S11 D16",42:"S10 D16",41:"S9 D16",40:"D20",
 39:"S7 D16",38:"D19",37:"S5 D16",36:"D18",35:"S3 D16",34:"D17",33:"S17 D8",
 32:"D16",31:"S15 D8",30:"D15",29:"S13 D8",28:"D14",27:"S19 D4",26:"D13",
 25:"S9 D8",24:"D12",23:"S7 D8",22:"D11",21:"S13 D4",20:"D10",19:"S11 D4",
 18:"D9",17:"S9 D4",16:"D8",15:"S7 D4",14:"D7",13:"S5 D4",12:"D6",
 11:"S3 D4",10:"D5",9:"S1 D4",8:"D4",7:"S3 D2",6:"D3",5:"S1 D2",
 4:"D2",3:"S1 D1",2:"D1"
};
const NO_FINISH = new Set([169,168,166,165,163,162,159]);
function hint(score){
  if(!G || G.out!=="double") return "";
  if(score<2 || score>170 || NO_FINISH.has(score)) return "";
  return CHECKOUT[score]||"";
}

/* ================= Spielzustand ================= */
function freshGame(names,start,out,legsToWin){
  return {
    names:[...names],
    players:names.map(()=>({score:start,legs:0,darts:0,points:0})),
    start, out, legsToWin,
    cur:0, turn:[], labels:[], history:[], winner:-1,
    legHistStart:0
  };
}
function save(){ try{localStorage.setItem("mkScorer",JSON.stringify({v:3,g:G}));}catch(e){} }
function load(){
  try{
    const s=localStorage.getItem("mkScorer"); if(!s) return null;
    const o=JSON.parse(s);
    if(!o||o.v!==3||!o.g||!Array.isArray(o.g.players)||!Array.isArray(o.g.names)) return null;
    return o.g;
  }catch(e){ return null; }
}
function dartSum(){ return G.turn.reduce((a,b)=>a+b,0); }

/* ================= Anzeige ================= */
function render(){
  const board=$("board");
  board.innerHTML="";
  for(let i=0;i<G.players.length;i++){
    const p=G.players[i];
    const rem=p.score-(i===G.cur?dartSum():0);
    const box=document.createElement("div");
    box.className="player"+(i===G.cur&&G.winner<0?" active":"");
    box.innerHTML=
      '<div class="pname">'+esc(G.names[i])+'</div>'+
      '<div class="pscore">'+Math.max(rem,0)+'</div>'+
      '<div class="plegs">Legs: '+p.legs+' / '+G.legsToWin+'</div>'+
      '<div class="avg">Ø 3-Dart: '+(p.darts?((p.points/p.darts)*3).toFixed(1):"-")+'</div>';
    board.appendChild(box);
  }
  if(G.history.length){
    const h=G.history[G.history.length-1];
    $("lastVisit").innerHTML="<b>"+esc(G.names[h.player])+":</b> "+
      (h.bust?"BUST":(h.labels.join(" - ")+" -> -"+h.turn.reduce((a,b)=>a+b,0)));
  } else $("lastVisit").textContent="";
  const h2=hint(G.players[G.cur].score-dartSum());
  $("checkout").textContent=h2?("Finish-Vorschlag: "+h2):"";
  // "Finish Him!" sobald Double-Out-Bereich erreichbar ist (<= 40, glatt & finishbar)
  const remNow=Math.max(G.players[G.cur].score-dartSum(),0);
  const inFinishZone = remNow>1 && remNow<=40 && remNow%2===0 && !NO_FINISH.has(remNow);
  if(inFinishZone && G._finishHimFor!==G.cur+"-"+remNow){
    G._finishHimFor=G.cur+"-"+remNow;
    playSfx('sounds/finishhim.mp3');
  } else if(!inFinishZone){ G._finishHimFor=null; }"";
  $("curVisit").textContent=G.labels.length?("Dieser Zug: "+G.labels.join(" - ")):"";
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

let msgTimer=null;
function flashMsg(text,cls){
  const m=$("msg");
  m.className="msg"+(cls?" "+cls:"");
  m.textContent=text||"";
  clearTimeout(msgTimer);
  if(text) msgTimer=setTimeout(()=>{$("msg").textContent="";},3000);
}

/* ================= Modus-Umschaltung ================= */
$("tabQuick").addEventListener("click",()=>setMode("quick"));
$("tabDarts").addEventListener("click",()=>setMode("darts"));
function setMode(m){
  $("tabQuick").classList.toggle("on",m==="quick");
  $("tabDarts").classList.toggle("on",m==="darts");
  $("quickRow").classList.toggle("on",m==="quick");
  $("numpad").style.display = (m==="quick") ? "grid" : "none"; // Zifferntasten nur im Summen-Modus
  $("padWrap").classList.toggle("on",m==="darts");
}

/* ================= Schnelleingabe (Zugsumme) ================= */
$("quickBtn").addEventListener("click",applyQuick);
$("quickInput").addEventListener("keydown",e=>{if(e.key==="Enter")applyQuick();});
function applyQuick(){
  if(G.winner>=0) return;
  const v=Math.floor(+$("quickInput").value);
  if(isNaN(v)||v<0||v>180){ flashMsg("Zahl zwischen 0 und 180 eingeben!","err"); return; }
  const p=G.players[G.cur];
  const rem=p.score;
  // Bust-Prüfung wie bei 3 Pfeilen
  if(rem-v<0 || rem-v===1 || (rem-v===0 && G.out==="double")){
    doBust(); $("quickInput").value=""; return;
  }
  if(rem-v===0 && G.out==="double"){
    flashMsg("Bei Double Out bitte den letzten Besuch einzeln eingeben (Tasten)!","err");
    setMode("darts"); return;
  }
  p.darts+=3; p.points+=v; p.score-=v;
  sayNumber(v);                                            // Zahl wird angesagt
  if(v===180) setTimeout(()=>playSfx('sounds/impressive.mp3'),900);           // 180er!
  else if(v>=100) setTimeout(()=>playSfx('sounds/welldone.mp3'),900);         // ab 100
  G.history.push({player:G.cur,turn:[v],labels:[String(v)]});
  G.turn=[]; G.labels=[];
  $("quickInput").value="";
  nextTurn();
}

/* ================= Spracheingabe (Diktieren der Zugsumme) ================= */
const DE_NUM = {"null":0,"eins":1,"ein":1,"eine":1,"zwei":2,"drei":3,"vier":4,"fünf":5,"fuenf":5,
 "sechs":6,"sieben":7,"acht":8,"neun":9,"zehn":10,"elf":11,"zwölf":12,"zwoelf":12,
 "dreizehn":13,"vierzehn":14,"fünfzehn":15,"sechzehn":16,"siebzehn":17,"achtzehn":18,"neunzehn":19,
 "zwanzig":20,"dreißig":30,"dreissig":30,"vierzig":40,"fünfzig":50,"sechzig":60,
 "siebzig":70,"achtzig":80,"neunzig":90};
function parseGermanNumber(text){
  const t=text.toLowerCase().replace(/punkt/g," ").trim();
  // 1) direkte Ziffern? (z.B. "140")
  const digits=t.match(/\d+/);
  if(digits){ let v=parseInt(digits[0],10); if(v<=180) return v; }
  // 2) Wortzahl zerlegen (Reihenfolge wichtig!)
  let s=t
    .replace(/hundert/g," \u00A7H\u00A7 ")
    .replace(/(ein|zwei|drei|vier|f\u00FCnf|fuenf|sechs|sieben|acht|neun)und/g,"$1 und ")
    .replace(/ein(?= \u00A7H\u00A7)/g,"ein ")
    .replace(/und(?=[a-z\u00E4\u00F6\u00FC\u00DF])/g,"und ")
    .replace(/\u00A7H\u00A7/g,"hundert");
  const tokens=s.split(/[ ]+/).filter(Boolean);
  let hundreds=0, rest=0, found=false;
  for(let i=0;i<tokens.length;i++){
    const w=tokens[i];
    if(w==="und") continue;
    if(w==="hundert"){ hundreds=100; found=true; continue; }
    if(w==="ein" && i+1<tokens.length && tokens[i+1]==="hundert"){ continue; }
    if(DE_NUM[w]!==undefined){ rest+=DE_NUM[w]; found=true; }
  }
  return found ? Math.min(hundreds+rest,180) : null;
}
let recog=null, listening=false;
function initSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ $("micBtn").style.display="none"; return; } // nicht unterstuetzt -> Taste ausblenden
  recog=new SR();
  recog.lang="de-DE"; recog.interimResults=false; recog.maxAlternatives=3;
  recog.onstart=()=>{ listening=true; $("micBtn").classList.add("listening"); flashMsg("Ich hoere zu... Zahl sagen!","ok"); };
  recog.onend=()=>{ listening=false; $("micBtn").classList.remove("listening"); };
  recog.onerror=e=>{
    listening=false; $("micBtn").classList.remove("listening");
    if(e.error==="not-allowed") flashMsg("Mikrofon-Zugriff verweigert!","err");
    else if(e.error==="no-speech") flashMsg("Nichts gehoert - nochmal!","err");
  };
  recog.onresult=ev=>{
    for(let i=0;i<ev.results.length;i++){
      const alts=ev.results[i];
      for(let j=0;j<alts.length;j++){
        const v=parseGermanNumber(alts[j].transcript);
        if(v!==null){
          $("quickInput").value=v;
          flashMsg("Erkannt: "+v+" ("+alts[0].transcript.trim()+")","ok");
          applyQuick();                       // direkt uebernehmen
          return;
        }
      }
    }
    flashMsg("Keine gueltige Zahl erkannt!","err");
  };
}
$("micBtn").addEventListener("click",()=>{
  if(!recog){ initSpeech(); }
  if(!recog){ flashMsg("Spracheingabe hier nicht verfuegbar!","err"); return; }
  if(listening){ recog.stop(); return; }
  try{ recog.start(); }catch(e){}
});

/* ================= Große Zifferntasten (Summeneingabe) ================= */
(function buildNumpad(){
  const np=$("numpad");
  function press(ch){
    const inp=$("quickInput");
    if(inp.value.length>=3) return;
    inp.value=(inp.value==="0"?"":inp.value)+ch;
    inp.focus();
  }
  for(const d of "123456789"){
    const b=document.createElement("button");
    b.textContent=d;
    b.addEventListener("click",()=>press(d));
    np.appendChild(b);
  }
  // letzte Reihe: 0, Löschen, OK
  const zero=document.createElement("button");
  zero.textContent="0"; zero.addEventListener("click",()=>press("0"));
  np.appendChild(zero);
  const del=document.createElement("button");
  del.className="fn"; del.textContent="<";
  del.addEventListener("click",()=>{ const inp=$("quickInput"); inp.value=inp.value.slice(0,-1); inp.focus(); });
  np.appendChild(del);
  const clr=document.createElement("button");
  clr.className="fn"; clr.textContent="C";
  clr.addEventListener("click",()=>{ $("quickInput").value=""; $("quickInput").focus(); });
  np.appendChild(clr);
  const ok=document.createElement("button");
  ok.className="okb"; ok.textContent="OK"; ok.style.gridColumn="span 2";
  ok.addEventListener("click",applyQuick);
  np.appendChild(ok);
})();

/* ================= Einzel-Pfeile ================= */
(function buildPad(){
  const pad=$("pad");
  for(let v=20;v>=1;v--){
    const b=document.createElement("button");
    b.className="key"; b.textContent=v;
    b.addEventListener("click",()=>throwDart(v));
    pad.appendChild(b);
  }
})();
let mul=1;
$("mulD").addEventListener("click",()=>setMul(mul===2?1:2));
$("mulT").addEventListener("click",()=>setMul(mul===3?1:3));
function setMul(m){
  mul=m;
  $("mulD").classList.toggle("on",m===2);
  $("mulT").classList.toggle("on",m===3);
}
function isDoubleVal(base,m){ return base===25 ? true : m===2; } // Bull zählt als Double

function registerThrow(val,label){
  const p=G.players[G.cur];
  const newRem=p.score-dartSum()-val;
  const lastIsDouble = label==="Bull" || /^D/.test(label);
  if(newRem<0 || newRem===1 || (newRem===0 && G.out==="double" && !lastIsDouble)) return false;
  G.turn.push(val); G.labels.push(label);
  p.darts++; p.points+=val; p.score-=val;
  if(p.score===0){ finishLeg(); }
  else if(G.turn.length===3){ endTurn(); }
  else { save(); render(); }
  return true;
}
function throwDart(base){
  if(G.winner>=0) return;
  const val=base*mul, label=(mul===2?"D":mul===3?"T":"")+base;
  setMul(1);
  if(!registerThrow(val,label)){
    // Bust: bereits gesetzte Pfeile des Zugs verfallen
    doBust();
  }
}
$("bullBtn").addEventListener("click",()=>{
  if(G.winner>=0) return;
  if(!registerThrow(50,"Bull")) doBust();
});
$("missBtn").addEventListener("click",()=>{
  if(G.winner>=0) return;
  G.players[G.cur].darts++;
  G.turn.push(0); G.labels.push("Miss");
  if(G.turn.length===3) endTurn(); else { save(); render(); }
});
$("endBtn").addEventListener("click",()=>{
  if(G.winner>=0) return;
  if(G.turn.length===0) flashMsg("Erst Pfeile eingeben!","err");
  else endTurn();
});

function doBust(){
  flashMsg("BUST! Zug endet ohne Punkte.","err");
  const p=G.players[G.cur];
  // Bereits im Zug gewertete Pfeile zuruecksetzen (Bust = ganze Visit zaehlt nicht)
  const thrown=G.turn.reduce((a,b)=>a+b,0);
  p.score+=thrown; p.points-=thrown;
  p.darts+=Math.max(3-G.turn.length,1);
  while(G.labels.length<3) G.labels.push("X");
  G.history.push({player:G.cur,turn:[],labels:[],bust:true});
  G.turn=[]; G.labels=[];
  setTimeout(nextTurn,900);
}
function nextTurn(){
  G.cur=(G.cur+1)%G.players.length;
  save(); render();
}
function endTurn(){
  const sum=G.turn.reduce((a,b)=>a+b,0);
  if(sum>0) sayNumber(sum);                                // Zugsumme ansagen
  if(sum===180) setTimeout(()=>playSfx('sounds/impressive.mp3'),900);   // 180er!
  else if(sum>=100) setTimeout(()=>playSfx('sounds/welldone.mp3'),900);// "Well done" ab 100
  G.history.push({player:G.cur,turn:[...G.turn],labels:[...G.labels]});
  G.turn=[]; G.labels=[];
  nextTurn();
}

/* ================= Undo ================= */
$("undoBtn").addEventListener("click",undo);
function undo(){
  if(G.winner>=0){
    G.winner=-1;
    $("winOverlay").style.display="none";
    const h=G.history.pop();
    const p=G.players[h.player];
    p.score+=h.turn.reduce((a,b)=>a+b,0);
    p.darts-=Math.max(h.turn.length,1);
    p.legs--;
    G.cur=h.player; G.turn=[]; G.labels=[];
    save(); render(); return;
  }
  if(G.turn.length>0){
    const v=G.turn.pop(); G.labels.pop();
    const p=G.players[G.cur];
    p.darts--; if(v>0) p.points-=v, p.score+=v;
  } else if(G.history.length){
    const h=G.history.pop();
    G.cur=h.player;
    const p=G.players[h.player];
    if(h.bust){ /* darts wurden beim Bust voll auf 3 aufgerundet -> hier -3 korrekt */ p.darts-=3; }
    else{
      const n=h.turn.length===1?3:h.turn.length; // Schnelleingabe = 3 Pfeile
      p.score+=h.turn.reduce((a,b)=>a+b,0);
      p.darts-=n; p.points-=h.turn.reduce((a,b)=>a+b,0);
    }
  } else { flashMsg("Nichts zum Rückgängigmachen.","err"); return; }
  save(); render();
}

/* ================= Leg / Match ================= */
function finishLeg(){
  const p=G.players[G.cur];
  p.legs++;
  G.history.push({player:G.cur,turn:[...G.turn],labels:[...G.labels]});
  // Flawless Victory? Gegner seit Leg-Beginn keine Punkte
  let oppPts=0;
  for(let i=G.legHistStart;i<G.history.length;i++){
    if(G.history[i].player!==G.cur) oppPts+=G.history[i].turn.reduce((a,b)=>a+b,0);
  }
  const oppAbove100 = G.players.some((op,idx)=>idx!==G.cur && op.score>100);
  if(oppAbove100){
    setTimeout(()=>playSfx('sounds/brutality.mp3'),400);   // BRUTALITY: Gegner weit hinten
  } else if(oppPts===0){
    setTimeout(()=>playSfx('sounds/flawless.mp3'),400);    // Flawless Victory
  }
  G.legHistStart=G.history.length;
  G.turn=[]; G.labels=[];
  if(p.legs>=G.legsToWin){
    setTimeout(()=>playSfx('sounds/fatality.mp3'),1400);   // Match gewonnen -> FATALITY
    G.winner=G.cur;
    save(); render();
    $("winnerText").textContent=G.names[G.cur]+" gewinnt das Match!  ("+
      G.players.map(x=>x.legs).join(":")+")";
    $("winOverlay").style.display="flex";
  } else {
    save(); render();
    $("winnerText").textContent=G.names[G.cur]+" gewinnt das Leg! ";
    $("winOverlay").style.display="flex";
  }
}
function nextLeg(){
  $("winOverlay").style.display="none";
  if(G.winner>=0){ localStorage.removeItem("dartScorer");localStorage.removeItem("mkScorer"); openSetup(); return; }
  const legs=G.players.map(p=>p.legs);
  const names=[...G.names];
  const histLen=0;
  G=freshGame(names,G.start,G.out,G.legsToWin);
  G.legHistStart=histLen;
  G.players.forEach((p,i)=>p.legs=legs[i]);
  G.cur=legs.reduce((a,b)=>a+b,0)%G.players.length; // Anwurf rotiert
  save(); render();
}

/* ================= Setup ================= */
function nameRowHTML(val){
  return '<div class="nameRow"><input class="pnameIn" value="'+esc(val)+'" maxlength="14" placeholder="Name"></div>';
}
function openSetup(){
  const rows=$("nameRows");
  const cur = G ? G.names : ["Spieler 1","Spieler 2"];
  rows.innerHTML = cur.map(nameRowHTML).join("");
  if(G){ $("startSel").value=String(G.start); $("outSel").value=G.out;
         $("legsSel").value=String(G.legsToWin||3); }
  $("setupDlg").showModal();
}
$("addPlayerBtn").addEventListener("click",()=>{
  if($("nameRows").children.length>=8){ flashMsgDialog(); return; }
  $("nameRows").insertAdjacentHTML("beforeend",nameRowHTML(""));
});
function flashMsgDialog(){ $("addPlayerBtn").textContent="Max. 8 Spieler"; 
  setTimeout(()=>$("addPlayerBtn").textContent="+ Spieler",1500); }

function applySetup(){
  const names=[...document.querySelectorAll(".pnameIn")]
    .map(i=>i.value.trim()).filter(Boolean);
  if(names.length<2){ document.querySelector("#setupDlg h2").textContent="Mindestens 2 Spieler!"; return; }
  playSfx('sounds/bell.mp3'); // Gong beim Start
  G=freshGame(names,+$("startSel").value,$("outSel").value,+$("legsSel").value);
  localStorage.removeItem("dartScorer");localStorage.removeItem("mkScorer");
  save();
  $("setupDlg").close();
  $("winOverlay").style.display="none";
  render();
}
$("setBtn").addEventListener("click",openSetup);

$("cancelBtn").addEventListener("click",()=>$("setupDlg").close());
$("startBtn2").addEventListener("click",applySetup);
$("nextLegBtn").addEventListener("click",nextLeg);
$("newMatchBtn").addEventListener("click",openSetup);

/* ================= Zahl-Ansage (Sprachausgabe) ================= */
let sayCtx=null;
function sayNumber(n){
  try{
    if(!("speechSynthesis" in window)) return;
    // Zahl auf Deutsch ansagen
    const u=new SpeechSynthesisUtterance(String(n));
    u.lang="de-DE";
    u.rate=0.9; u.pitch=0.4; u.volume=1;   // tief & drohend = annaehert MK-Announcer
    const vs=speechSynthesis.getVoices();
    const de=vs.find(v=>v.lang&&v.lang.startsWith("de"));
    if(de) u.voice=de;
    speechSynthesis.cancel();              // laufende Ansagen abbrechen
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= Sound ================= */
function playSfx(src,vol){
  try{
    const a=new Audio(src);
    a.volume=(vol===undefined?0.8:vol);
    const pr=a.play();
    if(pr && pr.catch) pr.catch(()=>{}); // Autoplay-Blockade: still ignorieren
    return a;
  }catch(e){ return null; }
}

/* Idle-Musik: 5 Min keine Aktivität -> Theme Song; bei Aktivität stoppen */
const IDLE_MS=5*60*1000;
let idleTimer=null, idleAudio=null;
function resetIdle(){
  // laufende Idle-Musik stoppen
  if(idleAudio){ try{idleAudio.pause(); idleAudio.currentTime=0;}catch(e){} idleAudio=null; }
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{
    idleAudio=playSfx('sounds/idle.mp3',0.6); // leiser im Hintergrund
  },IDLE_MS);
}
['pointerdown','keydown','touchstart','scroll'].forEach(ev=>
  document.addEventListener(ev,resetIdle,{passive:true}));

/* ================= Boot ================= */
// Theme beim ersten Öffnen abspielen (Browser erlauben das erst nach Nutzer-Interaktion)
let themePlayed=false;
function playTheme(){
  if(themePlayed) return; themePlayed=true;
  try{
    const a=new Audio('sounds/theme.mp3');
    a.volume=0.7;
    a.play().catch(()=>{ // Autoplay blockiert -> bei erstem Klick/Touch starten
      const once=()=>{ a.play().catch(()=>{}); document.removeEventListener('pointerdown',once); };
      document.addEventListener('pointerdown',once,{once:true});
    });
  }catch(e){}
}
playTheme();
document.addEventListener('pointerdown',playTheme,{once:true});

initSpeech();
G=load();
if(!G) openSetup();
if(!G) G=freshGame(["Spieler 1","Spieler 2"],501,"double",3); // Fallback bei Abbruch
render();
resetIdle(); // Idle-Timer beim Start starten
</script>
